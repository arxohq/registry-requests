# Posts the report of check-request as a pull request comment. Runs in the
# context of this repository (pull request comments need write access, which a
# pull_request run from a fork does not have) and never checks out or runs
# pull request code: it only reads the report artifact as text.
name: report-request
on:
  workflow_run:
    workflows: [check-request]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intake-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(head -c 16 report/pr-number | tr -cd '0-9')
          [ -n "$number" ] || { echo "no pull request number"; exit 1; }
          [ -f report/report.md ] || { echo "no report"; exit 0; }
          head -c 60000 report/report.md > body.md
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
